name: Deploy backend

# Tests the Supabase Edge Functions and deploys them to the project named by the VITE_SUPABASE_URL variable.
# Needs the repository SECRET SUPABASE_ACCESS_TOKEN (Supabase dashboard > Account > Access Tokens).
# Database migrations are NEVER applied automatically; run this workflow by hand with "migrate" ticked.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - 'supabase/package.json'
      - 'supabase/package-lock.json'
      - '.github/workflows/backend.yml'
  workflow_dispatch:
    inputs:
      migrate:
        description: 'Also apply new database migrations to production'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: backend
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: supabase/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npx deno check functions/*/index.ts

  deploy:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PUBLIC_URL: ${{ vars.VITE_SUPABASE_URL }}
      PUBLIC_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: supabase/package-lock.json
      - name: Check configuration
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::error::Add the repository secret SUPABASE_ACCESS_TOKEN."; exit 1; fi
          if [ -z "$PUBLIC_URL" ] || [ -z "$PUBLIC_KEY" ]; then echo "::error::Set the repository variables VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY."; exit 1; fi
      - run: npm ci
      - name: Deploy Edge Functions
        run: |
          ref=$(echo "$PUBLIC_URL" | sed -E 's#https://([^.]+)\..*#\1#')
          npx supabase functions deploy --remote="$ref" --use-api --no-verify-jwt --yes
      - name: Apply migrations (manual runs only, when ticked)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.migrate }}
        run: |
          ref=$(echo "$PUBLIC_URL" | sed -E 's#https://([^.]+)\..*#\1#')
          npx supabase db push --remote="$ref" --yes
      - name: Smoke test the deployed backend
        run: |
          for i in 1 2 3 4 5 6; do
            out=$(curl -fsS "$PUBLIC_URL/functions/v1/health" -H "apikey: $PUBLIC_KEY" || true)
            echo "$out"
            if echo "$out" | grep -q '"db":"ok"'; then exit 0; fi
            sleep 10
          done
          echo "::error::health did not report a working database"
          exit 1
